<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIゲームスタジオ (Powered by Puter.js)</title>
    <!-- Puter.jsのみ読み込み、外部マークダウンライブラリは廃止 -->
    <script src="https://puter.com/v2/"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #1e1e24;
            color: #fff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* 履歴サイドバー */
        .history-sidebar {
            width: 260px;
            background-color: #17171c;
            border-right: 1px solid #2d2d3a;
            display: flex;
            flex-direction: column;
            padding: 10px;
        }
        .new-chat-btn {
            background-color: transparent;
            color: #fff;
            border: 1px solid #4a4a5a;
            border-radius: 6px;
            padding: 10px;
            font-size: 0.9rem;
            cursor: pointer;
            margin-bottom: 20px;
            text-align: left;
            transition: background 0.2s;
        }
        .new-chat-btn:hover { background-color: #2a2a35; }
        .history-list { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
        .history-item {
            padding: 10px; border-radius: 6px; cursor: pointer; font-size: 0.85rem;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            color: #c5c5d2; transition: background 0.2s;
        }
        .history-item:hover, .history-item.active { background-color: #2a2a35; color: #fff; }

        /* 中央チャットエリア */
        .chat-panel { width: 450px; background-color: #202123; border-right: 1px solid #2d2d3a; display: flex; flex-direction: column; }
        .chat-header { padding: 15px; font-weight: bold; border-bottom: 1px solid #2d2d3a; color: #4dadff; }
        .chat-timeline { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .message { display: flex; flex-direction: column; gap: 5px; max-width: 100%; }
        .message.user { align-items: flex-end; }
        .message.assistant { align-items: flex-start; }
        .message-bubble { padding: 12px 16px; border-radius: 12px; font-size: 0.9rem; line-height: 1.6; max-width: 85%; word-break: break-word; }
        .message.user .message-bubble { background-color: #4dadff; color: #1e1e24; }
        .message.assistant .message-bubble { background-color: #2d2d3a; color: #ececf1; }
        
        /* 自作マークダウンの見た目調整 */
        .message-bubble h3 { margin: 10px 0 5px 0; color: #4dadff; font-size: 1.05rem; }
        .message-bubble p { margin-bottom: 8px; }
        .message-bubble p:last-child { margin-bottom: 0; }
        .message-bubble ul { margin: 5px 0 10px 20px; }
        .message-bubble li { margin-bottom: 4px; }
        .message-bubble code { background-color: #17171c; padding: 2px 4px; border-radius: 4px; font-family: monospace; color: #ff7b72; }
        .message-bubble pre { background-color: #17171c; padding: 10px; border-radius: 6px; overflow-x: auto; margin: 8px 0; border: 1px solid #444; }
        .message-bubble pre code { background-color: transparent; padding: 0; color: #fff; }

        .chat-input-area { padding: 15px; border-top: 1px solid #2d2d3a; background-color: #202123; }
        .input-wrapper { display: flex; gap: 10px; }
        textarea { flex-grow: 1; height: 50px; background-color: #40414f; border: 1px solid #565869; border-radius: 6px; color: #fff; padding: 10px; font-size: 0.9rem; resize: none; }
        textarea:focus { outline: none; border-color: #4dadff; }
        button.send-btn { background-color: #4dadff; color: #1e1e24; border: none; border-radius: 6px; padding: 0 20px; font-weight: bold; cursor: pointer; }
        button.send-btn:disabled { background-color: #555; color: #aaa; cursor: not-allowed; }

        /* 右側ゲームエリア */
        .game-panel { flex-grow: 1; display: flex; flex-direction: column; background-color: #111; }
        .game-header { background-color: #252530; padding: 12px 20px; font-size: 0.9rem; color: #ccc; border-bottom: 1px solid #2d2d3a; display: flex; justify-content: space-between; align-items: center; }
        .game-header span { color: #5cf2bd; font-weight: bold; }
        iframe { width: 100%; height: 100%; border: none; background-color: #fff; }
    </style>
</head>
<body>

    <!-- 1. 履歴サイドバー -->
    <div class="history-sidebar">
        <button class="new-chat-btn" onclick="startNewChat()">＋ 新しいゲームを作る</button>
        <div class="history-list" id="historyList"></div>
    </div>

    <!-- 2. 中央チャットエリア -->
    <div class="chat-panel">
        <div class="chat-header" id="chatTitle">新規ゲーム生成</div>
        <div class="chat-timeline" id="chatTimeline"></div>
        <div class="chat-input-area">
            <div class="input-wrapper">
                <textarea id="userInput" placeholder="どんなゲームを作りたいですか？"></textarea>
                <button class="send-btn" id="sendBtn" onclick="processChat()">送信</button>
            </div>
        </div>
    </div>

    <!-- 3. 右側ゲームプレビュー -->
    <div class="game-panel">
        <div class="game-header">
            <div>🎮 リアルタイム実行画面</div>
            <div id="gameStatus">ゲーム未生成</div>
        </div>
        <iframe id="gameIframe" sandbox="allow-scripts allow-modals"></iframe>
    </div>

    <script src="app.js"></script>
</body>
</html>
